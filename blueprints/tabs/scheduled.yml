label: Scheduled Publication
icon: calendar
fields:
  scheduled:
    type: structure
    label: Pages for scheduled publication.
    help: >
      This will happen automatically. Note that the schedule is checked every
      five minutes. Pages given their own scheduled publish date (on the
      page's Info tab) appear here automatically.
    fields:
      page:
        label: Page(s)
        type: pages
        status: all
      scheduledPublishDate:
        label: Publish Date
        type: date
      scheduledPublishTime:
        label: Publish Time
        type: time
    columns:
      page:
        width: 1/2
      scheduledPublishDate:
        width: 1/4
      scheduledPublishTime:
        width: 1/4
