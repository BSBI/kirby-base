label: Fields
icon: edit-line
columns:
  main:
    width: 1/1
    sections:
      desc:
        type: fields
        fields:
          description:
            type: textarea
            buttons: false
          keywords:
            type: textarea
            buttons: false
            help: >
              Only used by this site's own search, not by Google. Add words people
              might search for that aren't already on the page — other names,
              abbreviations, common misspellings. Comma-separated is fine. Most pages
              can leave this blank.
      search:
        type: fields
        fields:
          key_search_phrases:
            label: Key search phrases
            type: textarea
            buttons: false
            help: >
              One phrase per line — no commas. If someone's whole search exactly
              matches a line (capitals don't matter), this page goes to the top,
              above everything else. Use sparingly, for the few searches where this
              page must come first, and give each phrase to one page only.
      og-info:
        type: info
        label: " "
        text: |
          The fields below relate to Open Graph data, which determines how a page will
          be displayed when linked to via social media
      og:
        type: fields
        fields:
          og_title:
            label: Open Graph Title
            type: text
          og_description:
            label: Open Graph Description
            type: textarea
          og_image:
            label: Open Graph Image
            type: files
            multiple: false
