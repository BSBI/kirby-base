label: Permissions
icon: lock
fields:
  requiredRoles:
    label: Required Roles
    type: multiselect
    options:
      type: query
      query: kirby.roles.not('admin').not('editor')
      text: "{{ item.title }}"
      value: "{{ item.name }}"
    help: 'Note: Admins and Editors are able to see all pages'
  requiredRolesUntil:
    label: Restricted until (optional)
    type: date
    display: DD/MM/YYYY
    help: 'Leave empty to keep it restricted. Otherwise it stays restricted to the roles above up to and including this day, and everyone can see it from the next day.'
  password:
    label: Password to protect this page
    type: text
    help: 'Note: Admin and Editors are able to see this page without a password.'

