name: Form Text Input
icon: title

fields:
  label:
    type: text
    label: Question label
    required: true
  name:
    type: text
    label: Field name (optional; letters, digits, underscores)
    help: Leave blank and a fixed name is generated. Set one only when a system needs a particular name (e.g. email). Used as the column header in CSV exports; never change it once the form has responses.
  inputType:
    type: select
    label: Kind of answer
    default: text
    options:
      text: Text
      email: Email address
      tel: Phone number
      number: Number
      date: Date
      url: Web address
  required:
    type: toggle
    label: Required
    default: false
  help:
    type: text
    label: Help text
