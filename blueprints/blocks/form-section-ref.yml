name: Section from the library
icon: layers
label: "{{ title }}"
preview: fields
wysiwyg: true

fields:
  section:
    type: pages
    label: Library section
    required: true
    max: 1
    multiple: false
    query: site.find("form-library")?.index(true).filterBy("intendedTemplate", "form_section")
    help: Changes to the library section appear on every form that uses it.
  title:
    type: text
    label: Section title on this form
    help: Leave blank to use the library section's own title.
  showWhen:
    type: select
    label: Only show this section when…
    placeholder: Always show
    options:
      type: query
      query: page.formConditionChoices
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Pick a question and answer from an earlier section, or leave blank to always
      show. The list shows the radio and dropdown questions on this form as last saved,
      so save first after adding a question.
  alsoSaveAs:
    type: select
    label: Also save these answers as a separate response of type
    placeholder: No separate response
    options:
      type: query
      query: site.formTypes
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Optional. When this section is shown and answered, its answers are also saved
      on their own as a response of the chosen type, so they can be collated across
      forms (e.g. equality questions as "edi"). They stay on this form's response too.
  leaveOut:
    type: multiselect
    label: Leave out these questions
    options:
      type: query
      query: page.formLeaveOutChoices
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Optional. Questions of this library section that this form doesn't ask; other
      forms using the section still do. The list shows the questions of every library
      section on this form, as last saved: pick ones from this block's section (each
      shows its section in brackets), and save first after choosing a section. A
      question this form's responses have answered can't be left out (its column would
      be lost). If the section's question is later renamed, it comes back on this form
      and the Form check says so.
  adjust:
    type: structure
    label: Adjust questions on this form
    help: >
      Optional. Reword one of this library section's questions on this form only: its
      label, its options (one per line, choice questions only) or its help text. Leave
      a box blank to keep the library's. The question keeps its place and field name,
      so its answers stay in the same CSV column and analysis; other forms using the
      section keep the library's wording. Save first after choosing a section, so its
      questions are listed. If you reword an option that a "show when" uses, re-pick
      that condition.
    columns:
      question:
        width: 1/3
      label:
        width: 2/3
    fields:
      question:
        type: select
        label: Question
        required: true
        options:
          type: query
          query: page.formLeaveOutChoices
          value: "{{ item.key }}"
          text: "{{ item.value }}"
      label:
        type: text
        label: Label on this form
        help: Blank keeps the library's.
      options:
        type: textarea
        label: Options on this form
        buttons: false
        help: One per line. Blank keeps the library's. Choice questions only.
      help:
        type: text
        label: Help text on this form
        help: Blank keeps the library's.
