name: Section from the library
icon: layers
label: "{{ title }}"
preview: fields
wysiwyg: true

fields:
  section:
    type: pages
    label: Library section
    required: true
    max: 1
    multiple: false
    query: site.find("form-library")?.index(true).filterBy("intendedTemplate", "form_section")
    help: Changes to the library section appear on every form that uses it.
  title:
    type: text
    label: Section title on this form
    help: Leave blank to use the library section's own title.
  showWhen:
    type: select
    label: Only show this section when…
    placeholder: Always show
    options:
      type: query
      query: page.formConditionChoices
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Pick a question and answer from an earlier section, or leave blank to always
      show. The list shows the radio and dropdown questions on this form as last saved,
      so save first after adding a question.
  alsoSaveAs:
    type: select
    label: Also save these answers as a separate response of type
    placeholder: No separate response
    options:
      type: query
      query: site.formTypes
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Optional. When this section is shown and answered, its answers are also saved
      on their own as a response of the chosen type, so they can be collated across
      forms (e.g. equality questions as "edi"). They stay on this form's response too.
