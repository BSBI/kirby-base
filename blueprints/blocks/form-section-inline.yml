name: Section written for this form
icon: text-left
label: "{{ title }}"
preview: fields
wysiwyg: true

fields:
  title:
    type: text
    label: Section title
    help: Shown above the section's questions. Optional.
  formFields:
    extends: fields/formFieldBlocks
  showWhen:
    type: select
    label: Only show this section when…
    placeholder: Always show
    options:
      type: query
      query: page.formConditionChoices
      value: "{{ item.key }}"
      text: "{{ item.value }}"
    help: >
      Pick a question and answer from an earlier section, or leave blank to always
      show. The list shows the radio and dropdown questions on this form as last saved,
      so save first after adding a question.
