name: Section written for this form
icon: text-left
preview: fields
wysiwyg: true

fields:
  title:
    type: text
    label: Section title
    help: Shown above the section's questions. Optional.
  formFields:
    extends: fields/formFieldBlocks
  showWhenField:
    type: text
    label: Only show when question (field name)
    width: 1/2
    help: The field name of a radio or dropdown question in an earlier section. Leave blank to always show.
  showWhenValue:
    type: text
    label: …has the answer
    width: 1/2
    help: Must match one of that question's options exactly.
