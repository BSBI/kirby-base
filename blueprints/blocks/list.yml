name: field.blocks.list.name
icon: list-bullet
wysiwyg: true
preview: list
fields:
  text:
    label: field.blocks.list.name
    type: list
    # explicit marks list: the writer passes an array straight to the toolbar,
    # which is the only way custom marks (glossaryLink) get a toolbar button —
    # the toolbar's built-in default list ignores plugin marks
    marks:
      - bold
      - italic
      - underline
      - strike
      - code
      - "|"
      - link
      - email
      - glossaryLink
      - "|"
      - clear
  listStyle:
    label: List style
    type: select
    width: 1/2
    default: "1"
    required: false
    options:
      "1": 1. 2. 3.
      a: a. b. c.
      A: A. B. C.
      i: i. ii. iii.
      I: I. II. III.
    help: >
      How a numbered list is numbered on the site (the Panel preview always shows 1. 2. 3.).
      Bullet lists ignore it. Only the outermost list changes; lists inside it keep their own numbering.
