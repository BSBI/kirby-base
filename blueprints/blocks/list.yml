name: field.blocks.list.name
icon: list-bullet
wysiwyg: true
preview: list
fields:
  text:
    label: field.blocks.list.name
    type: list
    # explicit marks list: the writer passes an array straight to the toolbar,
    # which is the only way custom marks (glossaryLink) get a toolbar button —
    # the toolbar's built-in default list ignores plugin marks
    marks:
      - bold
      - italic
      - underline
      - strike
      - code
      - "|"
      - link
      - email
      - glossaryLink
      - "|"
      - clear
