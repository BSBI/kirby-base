name: Form Text Area
icon: text
label: "{{ label }}"

fields:
  label:
    type: text
    label: Question label
    required: true
  name:
    type: text
    label: Field name (optional; letters, digits, underscores)
    help: Leave blank and a fixed name is generated. Set one only when a system needs a particular name (e.g. email). Used as the column header in CSV exports; never change it once the form has responses.
  required:
    type: toggle
    label: Required
    default: false
  help:
    type: text
    label: Help text
  reportAs:
    type: tags
    label: Report as (export column)
    max: 1
    accept: all
    options:
      type: query
      query: site.formReportColumns
    help: Optional. Answers from every form that uses the same name go in one column of the form-type CSV, under that name. Leave blank to use the field name.
  fillFrom:
    type: select
    label: Fill from the link
    empty: Ask the question
    options:
      title: Its title
    help: When someone opens the form from a link about an event (or other page), this question is hidden and answered with that page's title. Without such a link it's asked as usual.
