name: Form Checkbox Group
icon: list-bullet

fields:
  label:
    type: text
    label: Question label
    required: true
  name:
    type: text
    label: Field name (optional; letters, digits, underscores)
    help: Leave blank and a fixed name is generated. Set one only when a system needs a particular name (e.g. email). Used as the column header in CSV exports; never change it once the form has responses.
  options:
    type: textarea
    label: Options (one per line)
    required: true
  required:
    type: toggle
    label: Required
    default: false
  help:
    type: text
    label: Help text
  reportAs:
    type: tags
    label: Report as (export column)
    max: 1
    accept: all
    options:
      type: query
      query: site.formReportColumns
    help: Optional. Answers from every form that uses the same name go in one column of the form-type CSV, under that name. Leave blank to use the field name.
