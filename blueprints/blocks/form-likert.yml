name: Form Likert Scale
icon: star
label: "{{ label }}"

fields:
  label:
    type: text
    label: Question label
    required: true
  name:
    type: text
    label: Field name (optional; letters, digits, underscores)
    help: Leave blank and a fixed name is generated. Set one only when a system needs a particular name (e.g. email). Used as the column header in CSV exports; never change it once the form has responses.
  required:
    type: toggle
    label: Required
    default: false
  leftLabel:
    type: text
    label: Left label
    placeholder: Strongly disagree
  middleLabel:
    type: text
    label: Middle label
    placeholder: Neutral
  rightLabel:
    type: text
    label: Right label
    placeholder: Strongly agree
  scaleMin:
    type: number
    label: Scale starts at
    default: 1
    min: 0
    max: 9
    step: 1
    width: 1/2
  scaleMax:
    type: number
    label: Scale ends at
    default: 5
    min: 1
    max: 10
    step: 1
    width: 1/2
    help: Whole numbers from 0 to 10. Blank, or an end not above the start, gives 1 to 5.
  help:
    type: text
    label: Help text
  reportAs:
    type: tags
    label: Report as (export column)
    max: 1
    accept: all
    options:
      type: query
      query: site.formReportColumns
    help: Optional. Answers from every form that uses the same name go in one column of the form-type CSV, under that name. Leave blank to use the field name.
