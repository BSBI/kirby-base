name: Form Likert Scale
icon: star

fields:
  label:
    type: text
    label: Question label
    required: true
  name:
    type: text
    label: Field name (optional; letters, digits, underscores)
    help: Leave blank and a fixed name is generated. Set one only when a system needs a particular name (e.g. email). Used as the column header in CSV exports; never change it once the form has responses.
  required:
    type: toggle
    label: Required
    default: false
  leftLabel:
    type: text
    label: Left label
    placeholder: Strongly disagree
  middleLabel:
    type: text
    label: Middle label
    placeholder: Neutral
  rightLabel:
    type: text
    label: Right label
    placeholder: Strongly agree
  help:
    type: text
    label: Help text
